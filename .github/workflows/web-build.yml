name: GeneScan Web Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: genescan-web-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type-check and build web app
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Build production website
        run: npm run build

      - name: Confirm build output
        run: test -s dist/index.html
