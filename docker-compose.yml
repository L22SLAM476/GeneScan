services:
  postgres:
    image: postgres:17-alpine
    container_name: genescan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: genescan
      POSTGRES_PASSWORD: genescan_dev_password
      POSTGRES_DB: genescan
    ports:
      - "5432:5432"
    volumes:
      - genescan_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genescan -d genescan"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  genescan_pgdata:
